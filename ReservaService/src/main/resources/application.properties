spring.application.name=ReservaService

server.port=8086
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/db_mimi_reservas?useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

userservice.url=${USERSERVICE_URL:http://localhost:8084}
servicioservice.url=${SERVICIOSERVICE_URL:http://localhost:8083}

# SQS config
aws.region=${AWS_REGION:us-east-1}
sqs.reserva-product.queue-url=${SQS_RESERVA_PRODUCT_QUEUE_URL:}