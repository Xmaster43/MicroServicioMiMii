spring.application.name=ProductService
server.port=8087

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/db_mimi_products?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.resources.add-mappings=false


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

spring.cloud.function.definition=reservaEventHandler

# SQS config
aws.region=${AWS_REGION:sa-east-1}
sqs.reserva-product.queue-url=${SQS_RESERVA_PRODUCT_QUEUE_URL:http://localhost:4566/000000000000/reserva-to-product.fifo}

# AWS credentials
aws.accessKeyId=${AWS_ACCESS_KEY_ID:test}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:test}