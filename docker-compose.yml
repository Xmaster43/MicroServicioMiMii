version: "3.8"
services:
  localstack:
    image: localstack/localstack:3.8.0
    container_name: mimi-localstack
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=sa-east-1
      - LOCALSTACK_AUTH_TOKEN=
  mysql:
    image: mysql:8.0
    container_name: mimi-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mimi_db
    volumes:
      - ./mysql-data:/var/lib/mysql